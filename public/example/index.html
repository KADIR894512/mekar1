<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MASTER PRINTER - Example Directory Index</title>
  <style>
    body {
      background: #0A0D14;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      margin: 0;
    }
    .card {
      background: #121826;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 16px;
      padding: 32px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 16px;
    }
    h1 { color: #FDE68A; margin-bottom: 12px; font-size: 1.6rem; }
    p { color: #94A3B8; line-height: 1.6; margin-bottom: 20px; }
    code { background: #1E293B; color: #F59E0B; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    a { color: #F59E0B; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Priority 1 Match Found</div>
    <h1>/example/index.html</h1>
    <p>
      This document was successfully served because the request to <code>/example/</code> matched the primary directory index <code>index.html</code> inside the <code>/example/</code> folder.
    </p>
    <p><a href="/">&larr; Back to Master Printer Router</a></p>
  </div>
</body>
</html>
